; Opal — firmware ESP32-S3 N16R8 (16 Mo flash QIO, 8 Mo PSRAM octale)

[env]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Opal complet (yeux + micro + haut-parleur + pont Iris)
[env:opal-s3]
build_src_filter = +<*> -<eyes_demo.cpp>
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
    lovyan03/LovyanGFX@^1.2.7

; Démo des yeux seuls sur 2 écrans GC9A01 : pio run -e eyes -t upload -t monitor
[env:eyes]
build_src_filter = +<eyes.cpp> +<eyes_demo.cpp>
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
