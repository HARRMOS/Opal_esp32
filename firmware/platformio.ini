; Opal Box — firmwares
;   opal-s3 / eyes : ESP32-S3 N16R8 (16 Mo flash QIO, 8 Mo PSRAM octale)
;   cam            : ESP32-CAM AI-Thinker (ESP32 classique, OV2640, 4 Mo PSRAM)

[env]
platform = espressif32@8.0.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; Opal complet (yeux + micro + haut-parleur + pont Opal)
[env:opal-s3]
extends = s3
build_src_filter = +<*> -<eyes_demo.cpp> -<cam_main.cpp>
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
    lovyan03/LovyanGFX@^1.2.7

; Démo des yeux seuls sur 2 écrans GC9A01 : pio run -e eyes -t upload -t monitor
[env:eyes]
extends = s3
build_src_filter = +<eyes.cpp> +<eyes_demo.cpp>
lib_deps =
    lovyan03/LovyanGFX@^1.2.7

; L'ESP32-S3 devient un adaptateur USB-série pour flasher la caméra (voir cam_flasher.cpp)
[env:cam-flasher]
extends = s3
build_src_filter = +<cam_flasher.cpp>

; Caméra : pio run -e cam -t upload -t monitor
; Flash à travers la passerelle S3 : vitesse fixe (la passerelle ne suit pas les
; changements de débit) et aucun reset par DTR/RTS (il redémarrerait l'S3) ;
; on met la caméra en mode flash à la main (IO0 à GND + RST).
[env:cam]
board = esp32cam
board_build.partitions = huge_app.csv
upload_speed = 115200
board_upload.before_reset = no-reset
board_upload.after_reset = no-reset
; Chargeur intégré à la puce plutôt que le « stub » : plus lent mais plus tolérant
; à travers la passerelle S3 (le stub y corrompt le flux série).
; Attend sans limite que la caméra passe en mode flash (IO0 à GND + RST).
upload_flags =
    --no-stub
    --connect-attempts=0
monitor_rts = 0
monitor_dtr = 0
build_src_filter = +<cam_main.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0

; Caméra déjà flashée une fois : mises à jour par WiFi (même réseau que le PC)
; pio run -e cam-ota -t upload
[env:cam-ota]
extends = env:cam
upload_protocol = espota
upload_port = opal-cam.local
upload_flags =
extra_scripts = post:ota_auth.py
