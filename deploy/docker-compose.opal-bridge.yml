# Service du pont Opal ESP32, à fusionner dans le docker-compose d'Opal sur le VPS.
# Il réutilise l'image d'Opal (même code, même .env, même mémoire) et passe par
# Traefik pour le HTTPS : l'ESP32 se connecte à wss://<domaine>/opal.
#
# À adapter au VPS : image, volume de données, réseau Traefik, entrypoint et certresolver.
services:
  opal-bridge:
    image: ${OPAL_IMAGE:-opal:latest}
    container_name: opal-bridge
    restart: unless-stopped
    working_dir: /app
    command: >
      python /opal_esp32/server/opal_bridge.py
      --iris-dir /app --host 0.0.0.0 --port 8765
    env_file:
      - .env                      # .env d'Opal (LLM, STT, TTS)
      - opal-bridge.env           # OPAL_DEVICE_TOKEN (+ OPAL_PIPER_MODEL)
    volumes:
      - ./Opal_esp32/server:/opal_esp32/server:ro
      - opal-data:/app/data       # même mémoire qu'Opal
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.opal-bridge.rule=Host(`opal.mondomaine.fr`) && PathPrefix(`/opal`)
      - traefik.http.routers.opal-bridge.entrypoints=websecure
      - traefik.http.routers.opal-bridge.tls.certresolver=letsencrypt
      - traefik.http.services.opal-bridge.loadbalancer.server.port=8765

volumes:
  opal-data:
    external: true

networks:
  traefik:
    external: true
